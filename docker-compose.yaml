services:
  db:
    image: postgres:${POSTGRES_IMAGE_TAG:-16}
    container_name: ${POSTGRES_CONTAINER_NAME:-formulario-db}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER não definido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD não definido}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB não definido}
      TZ: ${TZ:-America/Sao_Paulo}
      PGTZ: ${PGTZ:-America/Sao_Paulo}
    volumes:
      - formulario_db:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${POSTGRES_HEALTHCHECK_RETRIES:-10}
      start_period: ${POSTGRES_HEALTHCHECK_START_PERIOD:-10s}
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ${DOCKERFILE_NAME:-Dockerfile}
    image: ${API_IMAGE:-formulario-atendimento:local}
    container_name: ${API_CONTAINER_NAME:-formulario-atendimento}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  formulario_db:
    name: ${POSTGRES_VOLUME_NAME:-formulario_db}