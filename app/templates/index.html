<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pesquisa de satisfação</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >
</head>

<body>
    <main class="page-shell">
        <section class="survey-card" aria-live="polite">
            <div class="brand-area brand-top" aria-label="Logo da loja">
                <img
                    src="{{ url_for('static', path='img/logo.png') }}"
                    alt="Logo da loja"
                    onerror="this.style.display='none'"
                >
            </div>

            <div id="survey-screen" class="screen screen-active">
                <div class="watermark" aria-hidden="true">
                    <img
                        src="{{ url_for('static', path='img/logo.png') }}"
                        alt=""
                        onerror="this.style.display='none'"
                    >
                </div>

                <h1>Como você avalia nosso atendimento no açougue?</h1>

                <p class="subtitle">
                    Selecione uma das opções abaixo:
                </p>

                <form id="satisfaction-form" data-store-slug="{{ store.slug }}">
                    <div
                        class="options"
                        role="radiogroup"
                        aria-label="Avaliação da experiência"
                    >
                        <label class="option-card">
                            <input
                                type="radio"
                                name="answer"
                                value="ruim"
                            >
                            <span class="emoji" aria-hidden="true">😞</span>
                            <span>Ruim</span>
                        </label>

                        <label class="option-card">
                            <input
                                type="radio"
                                name="answer"
                                value="bom"
                            >
                            <span class="emoji" aria-hidden="true">🙂</span>
                            <span>Bom</span>
                        </label>

                        <label class="option-card">
                            <input
                                type="radio"
                                name="answer"
                                value="excelente"
                            >
                            <span class="emoji" aria-hidden="true">🤩</span>
                            <span>Excelente</span>
                        </label>
                    </div>

                    <button
                        id="submit-button"
                        class="submit-button"
                        type="submit"
                        disabled
                    >
                        Enviar resposta
                    </button>
                </form>

                <p
                    id="error-message"
                    class="error-message"
                    role="alert"
                ></p>
            </div>

            <div id="thank-you-screen" class="screen" hidden>
                <div class="thank-you-icon" aria-hidden="true">
                    💚🤍🧡
                </div>

                <h1>Obrigado pela sua resposta!</h1>

                <p class="subtitle">
                    Sua opinião é muito importante para nós.
                </p>

                <p class="countdown-message">
                    Retornando para a tela inicial em
                    <strong id="countdown">8</strong>
                </p>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', path='js/app.js') }}"></script>
</body>
</html>
